<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Blog notizie — Yobee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Palette Yobee — Brand book 1.0 (ottobre 2026), palette ufficiale e digitale */
  :root{
    --yb-nero:#000000; --yb-indaco:#3533CD;
    --yb-teal:#71BABC;            /* unico accento: kicker, bordi, numeri */
    --yb-ink:#0B0B1A; --yb-lavanda:#C9CBE8; --yb-navy:#15144D; --yb-grigio-chiaro:#BDBCBC;
    --yb-corallo:#FF6A4D;         /* errori e rischi (eccezione prevista dal brand) */
    --yb-ambra:#E0A23C;           /* solo avvisi di quota bassa: eccezione funzionale */
    --yb-gradiente:linear-gradient(90deg,var(--yb-nero) 0%,var(--yb-indaco) 100%);

    --bg:var(--yb-nero); --bg2:var(--yb-navy);
    --panel:color-mix(in srgb,var(--yb-ink) 55%,transparent); --panel-2:color-mix(in srgb,var(--yb-ink) 72%,transparent);
    --border:color-mix(in srgb,var(--yb-lavanda) 18%,transparent); --border-strong:color-mix(in srgb,var(--yb-lavanda) 32%,transparent);
    --text:#FFFFFF; --muted:color-mix(in srgb,var(--yb-lavanda) 82%,transparent); --soft:var(--yb-lavanda);
    --field:color-mix(in srgb,var(--yb-nero) 35%,transparent); --placeholder:color-mix(in srgb,var(--yb-lavanda) 60%,transparent);
    --accent:var(--yb-teal); --accent-light:var(--yb-teal); --accent-dim:color-mix(in srgb,var(--yb-teal) 30%,transparent);
    --accent-soft:color-mix(in srgb,var(--yb-teal) 14%,transparent); --accent-line:color-mix(in srgb,var(--yb-teal) 45%,transparent);
    --warn:var(--yb-ambra); --danger:var(--yb-corallo);
    --font:'Urbanist',system-ui,sans-serif;
    --mono:'Urbanist',system-ui,sans-serif;   /* il brand non ha un monospazio: etichette in Urbanist */
    --display:'Staatliches','Urbanist',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--yb-gradiente) var(--bg);color:var(--text);font-family:var(--font);font-size:15px;
    -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
  .wrap{max-width:820px;margin:0 auto;padding:32px 24px 80px;position:relative;z-index:1;}

  header{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:28px;flex-wrap:wrap;gap:14px;}
  .logo-img{height:32px;width:auto;display:block;align-self:flex-start;margin:0 0 18px;}
  .eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--accent-light);margin:0 0 8px;}
  h1{font-family:var(--display);font-size:44px;font-weight:400;line-height:.92;margin:0;letter-spacing:.01em;text-transform:uppercase;}
  .sub{color:var(--soft);font-size:15px;margin:8px 0 0;line-height:1.45;}
  .backlink{font-family:var(--mono);font-size:13px;font-weight:600;color:#fff;text-decoration:none;padding:8px 13px;border:1px solid var(--border-strong);border-radius:8px;}
  .backlink:hover{color:#fff;border-color:var(--accent);}

  /* scheda nome ed email */
  .gate{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
    background:var(--panel-2);
    border:1px solid var(--border-strong);border-radius:16px;padding:22px;margin-bottom:22px;}
  .gate .intro{flex-basis:100%;margin:0 0 4px;color:var(--soft);font-size:15px;line-height:1.5;}
  .field{display:flex;flex-direction:column;gap:8px;flex:1;min-width:200px;}
  label{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);}
  .gate input{background:var(--field);border:1px solid var(--border-strong);border-radius:10px;color:#fff;
    font-family:var(--font);font-size:16px;padding:12px 14px;width:100%;outline:none;transition:border-color .15s,background .15s;}
  .gate input::placeholder{color:var(--placeholder);}
  .gate input:focus{border-color:var(--accent);background:color-mix(in srgb,var(--yb-nero) 50%,transparent);box-shadow:0 0 0 3px var(--accent-soft);}
  .gate input.err{border-color:var(--danger);}
  .btn{background:var(--accent);color:var(--yb-navy);border:none;border-radius:10px;padding:13px 22px;font-family:var(--font);
    font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s,transform .1s;white-space:nowrap;}
  .btn:hover{background:color-mix(in srgb,var(--yb-teal) 82%,#fff);} .btn:active{transform:scale(.98);} .btn:disabled{background:var(--accent-dim);color:color-mix(in srgb,#fff 60%,transparent);cursor:not-allowed;}
  .gate.closed{display:none;}
  .who{display:none;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 18px;
    font-family:var(--mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere;}
  .who.show{display:flex;}
  .who button{background:none;border:1px solid var(--border-strong);border-radius:8px;color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;padding:6px 11px;cursor:pointer;}
  .who button:hover{color:#fff;border-color:var(--accent);}

  .status{min-height:20px;margin:0 2px 18px;font-family:var(--mono);font-size:14px;color:var(--muted);}
  .status.err{color:var(--danger);}

  /* filtri */
  .filters{display:none;gap:8px;flex-wrap:wrap;margin:0 0 24px;}
  .filters.show{display:flex;}
  .chip{background:var(--panel);border:1px solid var(--border-strong);border-radius:99px;color:var(--soft);
    font-family:var(--font);font-size:14px;font-weight:600;padding:8px 14px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;}
  .chip .n{font-family:var(--display);font-size:15px;font-weight:400;color:var(--muted);margin-left:6px;}
  .chip:hover{border-color:var(--accent-line);color:#fff;}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--yb-navy);}
  .chip[aria-pressed="true"] .n{color:var(--yb-navy);}

  /* giorni e notizie */
  .day{margin:0 0 30px;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .day-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    border-bottom:1px solid var(--border-strong);padding:0 2px 8px;margin-bottom:6px;}
  .day-head h2{font-family:var(--display);font-size:26px;font-weight:400;line-height:.92;letter-spacing:.01em;text-transform:uppercase;margin:0;}
  .day-head .count{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;}
  .sec{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-light);margin:16px 2px 8px;}
  .item{background:var(--panel);border:1px solid var(--border-strong);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .item a.title{color:#fff;font-weight:700;font-size:16px;line-height:1.35;text-decoration:none;}
  .item a.title:hover{color:var(--accent-light);text-decoration:underline;}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-family:var(--mono);font-size:13px;color:var(--muted);}
  .badge-nl{display:inline-block;color:var(--accent-light);border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:99px;padding:2px 9px;font-weight:600;}
  .item p{margin:8px 0 0;color:var(--soft);font-size:15px;line-height:1.5;}

  .empty{background:var(--panel);border:1px dashed var(--border-strong);border-radius:16px;padding:44px 24px;text-align:center;color:var(--soft);}
  .empty h3{font-family:var(--display);color:#fff;font-weight:400;font-size:28px;line-height:.92;text-transform:uppercase;letter-spacing:.01em;margin:0 0 10px;}
  .empty .btn{margin:16px auto 0;}

  footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:12px;color:var(--yb-grigio-chiaro);}

  @media (max-width:560px){.wrap{padding:24px 16px 64px;}h1{font-size:36px}.gate{padding:18px}.btn{width:100%;justify-content:center;}}
  @media (prefers-reduced-motion:reduce){.day{animation:none;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <img src="../yobee-logo-negativo.png" alt="Yobee" class="logo-img">
      <p class="eyebrow">Trade Marketing News</p>
      <h1>Blog notizie</h1>
      <p class="sub">Le notizie dell'archivio degli ultimi 30 giorni, per giorno e per sezione.</p>
    </div>
    <a class="backlink" href="../">← Hub</a>
  </header>

  <form class="gate" id="gate" novalidate>
    <p class="intro">Per aprire il blog scrivi nome ed email. Il browser li ricorda per la prossima volta.</p>
    <div class="field">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" autocomplete="name" maxlength="100" placeholder="Nome e cognome">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="200" placeholder="nome@yobee.it">
    </div>
    <button class="btn" id="go" type="submit">Apri il blog</button>
  </form>

  <div class="who" id="who">
    <span id="who-text"></span>
    <button type="button" id="cambia">Cambia nome o email</button>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="filters" id="filters" role="group" aria-label="Filtra per sezione"></div>

  <div id="content"></div>

  <footer>
    <span>Yobee · AI Operations</span>
    <span id="foot"></span>
  </footer>
</div>

<script>
(function(){
  // ===== UNICO PUNTO DA CAMBIARE PER MIGRARE L'ISTANZA n8n (come nella pagina principale) =====
  var N8N_BASE = 'https://ops.yobee.ai';
  // =============================================================================================
  var ENDPOINT = N8N_BASE + '/webhook/newsletter-blog';
  var YOBEE_TOKEN = 'yobee-hub-2026';   // lo stesso della pagina principale: e' pubblico, ferma solo chi trova l'indirizzo per caso
  var REQUEST_TIMEOUT_MS = 30000;
  var LS_NOME = 'yobee_nome';            // stesse chiavi dei moduli del pannello: chi li ha gia' compilati trova la scheda pronta
  var LS_EMAIL = 'yobee_email';
  var SEZIONI = [
    { n: 1, nome: 'News dalle aziende' },
    { n: 2, nome: 'Gare' },
    { n: 3, nome: 'Andamento del mercato' },
    { n: 4, nome: 'Ricerche di mercato' }
  ];

  var gate = document.getElementById('gate');
  var nomeEl = document.getElementById('nome');
  var emailEl = document.getElementById('email');
  var goBtn = document.getElementById('go');
  var whoEl = document.getElementById('who');
  var statusEl = document.getElementById('status');
  var filtersEl = document.getElementById('filters');
  var contentEl = document.getElementById('content');
  var footEl = document.getElementById('foot');

  var notizie = [];
  var filtro = 0; // 0 = tutte

  function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }

  // Le stesse regole del webhook: cosi' la pagina non manda richieste che verrebbero rifiutate.
  function nomeValido(v){ return v.length >= 1 && v.length <= 100; }
  function emailValida(v){ return v.length <= 200 && /^[\x21-\x7e]+$/.test(v) && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v); }

  function setStatus(m, err){ statusEl.textContent = m || ''; statusEl.className = 'status' + (err ? ' err' : ''); }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }

  // "AAAA-MM-GG" -> data locale senza passare dal fuso (il giorno lo ha gia' deciso il database, in Europe/Rome)
  function giornoLungo(s){
    var p = String(s).split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var t = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function giornoCorto(s){ var p = String(s).split('-'); return p[2] + '/' + p[1]; }

  function linkSicuro(u){
    try { var x = new URL(String(u)); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : null; }
    catch (e) { return null; }
  }

  function showEmpty(titolo, testo, conRiprova){
    contentEl.textContent = '';
    var box = el('div', 'empty');
    box.appendChild(el('h3', null, titolo));
    box.appendChild(el('div', null, testo));
    if (conRiprova) {
      var b = el('button', 'btn', 'Riprova');
      b.type = 'button';
      b.addEventListener('click', function(){ apri(nomeEl.value.trim(), emailEl.value.trim().toLowerCase()); });
      box.appendChild(b);
    }
    contentEl.appendChild(box);
  }

  function apriScheda(){
    gate.classList.remove('closed');
    whoEl.classList.remove('show');
    filtersEl.classList.remove('show');
    contentEl.textContent = '';
    footEl.textContent = '';
    setStatus('');
    nomeEl.focus();
  }

  function disegnaFiltri(){
    filtersEl.textContent = '';
    var conta = { 0: notizie.length, 1: 0, 2: 0, 3: 0, 4: 0 };
    notizie.forEach(function(x){ if (conta[x.sezione] !== undefined) conta[x.sezione]++; });
    [{ n: 0, nome: 'Tutte' }].concat(SEZIONI).forEach(function(s){
      var b = el('button', 'chip', (s.n ? s.n + ' ' : '') + s.nome);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(filtro === s.n));
      b.appendChild(el('span', 'n', conta[s.n]));
      b.addEventListener('click', function(){ filtro = s.n; disegnaFiltri(); disegna(); });
      filtersEl.appendChild(b);
    });
    filtersEl.classList.add('show');
  }

  function disegna(){
    contentEl.textContent = '';
    var lista = notizie.filter(function(x){ return filtro === 0 || x.sezione === filtro; });
    if (!lista.length) {
      showEmpty('Nessuna notizia', filtro === 0
        ? 'Negli ultimi 30 giorni l\'archivio non ha notizie.'
        : 'Negli ultimi 30 giorni non ci sono notizie in questa sezione.', false);
      return;
    }
    // L'ordine arriva gia' dal database (giorno dal piu' recente, sezione, voto, id): qui si raggruppa soltanto.
    var giorni = [];
    lista.forEach(function(x){
      var g = giorni.length && giorni[giorni.length - 1].giorno === x.giorno ? giorni[giorni.length - 1] : null;
      if (!g) { g = { giorno: x.giorno, voci: [] }; giorni.push(g); }
      g.voci.push(x);
    });
    giorni.forEach(function(g){
      var sec = el('section', 'day');
      var head = el('div', 'day-head');
      head.appendChild(el('h2', null, giornoLungo(g.giorno)));
      head.appendChild(el('span', 'count', g.voci.length === 1 ? '1 notizia' : g.voci.length + ' notizie'));
      sec.appendChild(head);
      var ultima = null;
      g.voci.forEach(function(x){
        if (x.sezione !== ultima) {
          var s = SEZIONI[x.sezione - 1];
          sec.appendChild(el('div', 'sec', x.sezione + '. ' + (s ? s.nome : 'Sezione ' + x.sezione)));
          ultima = x.sezione;
        }
        var card = el('article', 'item');
        var href = linkSicuro(x.url);
        var titolo;
        if (href) {
          titolo = el('a', 'title', x.titolo);
          titolo.href = href;
          titolo.target = '_blank';
          titolo.rel = 'noopener noreferrer';
        } else {
          titolo = el('span', 'title', x.titolo);
        }
        card.appendChild(titolo);
        var meta = el('div', 'meta');
        meta.appendChild(el('span', null, x.testata));
        if (x.in_newsletter) meta.appendChild(el('span', 'badge-nl', 'proposta in newsletter il ' + giornoCorto(x.in_newsletter)));
        card.appendChild(meta);
        if (x.sintesi) card.appendChild(el('p', null, x.sintesi));
        sec.appendChild(card);
      });
      contentEl.appendChild(sec);
    });
  }

  function apri(nome, email){
    goBtn.disabled = true;
    setStatus('Apro l\'archivio…');
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, REQUEST_TIMEOUT_MS);
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Yobee-Token': YOBEE_TOKEN },
      body: JSON.stringify({ nome: nome, email: email }),   // nome ed email nel corpo, mai nell'indirizzo
      signal: controller.signal,
      cache: 'no-store'
    })
      .then(function(res){
        return res.json().catch(function(){ return null; }).then(function(data){ return { res: res, data: data }; });
      })
      .then(function(r){
        if (r.res.status === 400) {
          gate.classList.remove('closed');
          setStatus('Nome o email non validi: ' + ((r.data && r.data.messaggio) || 'controllali e riprova') + '.', true);
          return;
        }
        if (r.res.status === 401 || r.res.status === 403) {
          showEmpty('Accesso non riuscito', 'Il blog non ha riconosciuto la pagina. Avvisa Alfonso.', false);
          setStatus('Errore ' + r.res.status, true);
          return;
        }
        if (!r.res.ok || !r.data || !Array.isArray(r.data.notizie)) throw new Error('HTTP ' + r.res.status);
        lsSet(LS_NOME, nome);
        lsSet(LS_EMAIL, email);
        notizie = r.data.notizie.filter(function(x){ return x && x.giorno && x.titolo; });
        gate.classList.add('closed');
        document.getElementById('who-text').textContent = 'Stai leggendo come ' + nome + ' · ' + email;
        whoEl.classList.add('show');
        disegnaFiltri();
        disegna();
        setStatus('');
        var ora = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        footEl.textContent = notizie.length + ' notizie · ultimi ' + (r.data.giorni || 30) + ' giorni · aggiornato alle ' + ora;
      })
      .catch(function(){
        showEmpty('Archivio non raggiungibile', 'L\'archivio non ha risposto. Riprova tra poco.', true);
        setStatus('Archivio non raggiungibile, riprova.', true);
      })
      .finally(function(){ clearTimeout(timer); goBtn.disabled = false; });
  }

  gate.addEventListener('submit', function(ev){
    ev.preventDefault();
    var nome = nomeEl.value.trim();
    var email = emailEl.value.trim().toLowerCase();
    var okN = nomeValido(nome), okE = emailValida(email);
    nomeEl.classList.toggle('err', !okN);
    emailEl.classList.toggle('err', !okE);
    if (!okN || !okE) {
      setStatus(!okN && !okE ? 'Scrivi nome ed email.' : (!okN ? 'Scrivi il nome.' : 'Scrivi un\'email valida.'), true);
      return;
    }
    apri(nome, email);
  });
  document.getElementById('cambia').addEventListener('click', apriScheda);

  nomeEl.value = lsGet(LS_NOME);
  emailEl.value = lsGet(LS_EMAIL);
  (nomeEl.value ? emailEl : nomeEl).focus();
})();
</script>
</body>
</html>
